name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thrones
          POSTGRES_PASSWORD: thrones
          POSTGRES_DB: thronesdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thrones -d thronesdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://thrones:thrones@localhost:5432/thronesdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thrones
          POSTGRES_PASSWORD: thrones
          POSTGRES_DB: thronesdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thrones -d thronesdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://thrones:thrones@localhost:5432/thronesdb
      VITE_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Import a small set of real card data for the smoke test
        run: npm run db:seed --workspace=backend -- --packs=Core --skip-images
      - run: npm run build --workspace=packages/shared
      - name: Install Playwright browsers
        run: npx --workspace=e2e playwright install --with-deps chromium
      - name: Start backend
        run: nohup npm run dev --workspace=backend > backend.log 2>&1 &
      - name: Start frontend
        run: nohup npm run dev --workspace=frontend > frontend.log 2>&1 &
      - name: Wait for servers
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf http://localhost:5173 > /dev/null && break; sleep 1; done
      - run: npm run test --workspace=e2e
