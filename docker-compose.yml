services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: thrones
      POSTGRES_PASSWORD: thrones
      POSTGRES_DB: thronesdb
    ports:
      - "5432:5432"
    volumes:
      - thronesdb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thrones -d thronesdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  thronesdb_pgdata:
